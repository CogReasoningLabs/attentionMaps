run_name: nepali-corpus-example
output_root: ../../data/pipeline-runs

input:
  # Use exactly one: local_path or google_drive.
  google_drive: "https://drive.google.com/drive/folders/REPLACE_WITH_SOURCE_ID"
  text_columns: [text]
  source_columns: [source]
  # Set for supervised, label-balanced D2 runs.
  label_column: null

destination_drive_folder_id: "REPLACE_WITH_DESTINATION_FOLDER_ID"

sampling:
  fraction: 1.0
  max_records: null
  seed: 42

cleaning:
  min_tokens: 5
  min_devanagari_ratio: 0.70

deduplication:
  mode: multistage
  near_duplicate_threshold: 0.80
  minhash_permutations: 128
  minhash_bands: 16
  shingle_size: 5
  edit_similarity_threshold: 0.80
  boilerplate_min_documents: 3
  boilerplate_min_characters: 40

# D2 is an optional model-aware selection stage after deduplication. The full
# clean-data shards are always retained. Pin embedding_revision to a commit for
# research runs; "main" is suitable only while exploring the configuration.
pruning:
  enabled: false
  # traditional_nlp or domain_specific_finetuning only
  use_case: traditional_nlp
  retention_fraction: 0.50
  n_neighbors: 10
  gamma_forward: 1.0
  gamma_reverse: 0.8
  graph_backend: auto
  exact_block_size: 1024
  max_exact_records: 10000
  label_balanced: false
  embedding_model_id: FacebookAI/xlm-roberta-base
  embedding_revision: main
  embedding_pooling: cls
  embedding_batch_size: 32
  embedding_max_length: 256
  embedding_device: auto
  normalize_embeddings: false
  local_files_only: false
  embeddings_path: null
  difficulty_mode: uniform
  difficulty_scores_path: null

execution:
  batch_size: 512
  batch_max_mib: 64
  workers: 8
  max_pending_batches: 16
  shard_rows: 50000
  drive_chunk_mib: 8

eda:
  enabled: true
  top_items: 100
  max_vocabulary: 500000
  max_ngrams: 250000
  reservoir_size: 10000
  max_pattern_tokens_per_document: 5000
