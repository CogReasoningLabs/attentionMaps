# Stable IDs for reusable dataset selections. Local paths are relative to this file.
# Definitions follow saved inspections; Hugging Face revisions are pinned to those reports.
# Keep models/run settings in ../embeddings.yaml. See ../../docs/dataset-source-registry.md.
# Registration does not rerun or modify any saved inspection, embedding, or clustering result.
# Run: venv/bin/python scripts/cluster_dataset.py sources
version: 1
sources:
  huggingface:
    gorkhapatra-nepali:
      label: Gorkhapatra Nepali epaper
      dataset: Aananda-giri/gorkhapatra-nepali-epaper
      revision: 06ec9d5dbf5d67668df5dc7e7514048dc8a20d2f
      config: default
      split: train
      training_schema: pretraining
      text_record_unit: line
      field_mapping: {}
      text_columns: [text]

    sangraha-verified-nep:
