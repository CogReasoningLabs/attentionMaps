      split: train
      training_schema: task_specific_supervised
      text_record_unit: line
      field_mapping: {text: text, label: is_toxic}
      task_name: toxicity_classification
      text_columns: [text]
      row_filters:
        lang: [ne]

    # Separate orientations: combining lang1 and lang2 filters would require BOTH to be Nepali.
    nllb-ne-text1:
      label: NLLB sample — Nepali in text1
      dataset: slone/nllb-200-10M-sample
      revision: 112cd775b7d7146372f560738eda4fd53c8a563d
      config: default
      split: train
      training_schema: task_specific_supervised
      text_record_unit: line
      field_mapping: {text: text1, label: text2}
      task_name: translation
      text_columns: [text1]
      row_filters:
        lang1: [npi_Deva]

    nllb-ne-text2:
      label: NLLB sample — Nepali in text2
      dataset: slone/nllb-200-10M-sample
      revision: 112cd775b7d7146372f560738eda4fd53c8a563d
