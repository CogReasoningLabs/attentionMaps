      training_schema: task_specific_supervised
      text_record_unit: line
      field_mapping: {text: text2, label: text1}
      task_name: translation
      text_columns: [text2]
      row_filters:
        lang2: [npi_Deva]

    # Both context and question form the input. A field_mapping.text override would discard that selection.
    multi-wiki-qa-ne:
